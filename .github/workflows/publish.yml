name: Publish Extension

# main への push で patch バージョンを自動 bump し、VS Code Marketplace に publish する。
# bot のコミットは GITHUB_TOKEN によるものなので再度ワークフローを起こさない（無限ループ防止）。

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - 'vsc-extension-quickstart.md'
      - '.github/**'

permissions:
  contents: write

concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify publisher migration and credentials
        env:
          CONFIRMED_PUBLISHER: ${{ vars.MARKETPLACE_PUBLISHER || 'MC-Mod-Utility' }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          node <<'NODE'
          const { publisher } = require('./package.json');
          if (publisher !== process.env.CONFIRMED_PUBLISHER) {
            throw new Error('Publisher migration is not confirmed. Complete Marketplace transfer before changing MARKETPLACE_PUBLISHER.');
          }
          if (!process.env.VSCE_PAT) {
            throw new Error('Configure the VSCE_PAT repository secret for the confirmed publisher.');
          }
          NODE

      - run: npm ci

      - name: Verify Marketplace publisher access
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce verify-pat hrmcngs

      - name: Bump patch version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW_VERSION=$(npm version patch --no-git-tag-version)
          echo "version=${NEW_VERSION#v}" >> "$GITHUB_OUTPUT"
          git add package.json package-lock.json
          git commit -m "chore: release ${NEW_VERSION}"
          git push

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish

      - name: Tag release
        run: |
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

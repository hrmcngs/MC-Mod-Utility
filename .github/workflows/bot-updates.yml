name: Diagnose update check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Read-only update diagnosis without AI keys or file changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import {GitHub} from './.github/ai-bot/src/github.js';
          import {checkUpdate,installation,STATE} from './.github/ai-bot/src/updates.js';
          const original=globalThis.fetch;
          globalThis.fetch=async(url,options)=>{
            const res=await original(url,options);
            const source=String(url).includes('/hrmcngs/github-ai-fix-bot/');
            console.log(JSON.stringify({endpoint:source?'public-source':'destination',status:res.status,remaining:res.headers.get('x-ratelimit-remaining')}));
            return res;
          };
          try{
            const gh=new GitHub(process.env.GITHUB_REPOSITORY,process.env.GH_TOKEN);
            const repo=await gh.request(gh.path());const event=JSON.parse(await readFile(process.env.GITHUB_EVENT_PATH,'utf8'));console.log(JSON.stringify({event:process.env.GITHUB_EVENT_NAME,eventRepo:event.repository?.full_name,repository:process.env.GITHUB_REPOSITORY,ref:process.env.GITHUB_REF,defaultBranch:repo.default_branch}));console.log('destination: OK');
            const state=installation(JSON.parse(await readFile(STATE,'utf8')));console.log('installation: OK');
            const result=await checkUpdate(gh,state,undefined,'runtime');console.log(result?'update available':'no runtime update');
          }catch(error){console.log('safe error category: '+String(error.code||'INTERNAL'));process.exitCode=1;}
          JS

name: Diagnose update check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Read-only update diagnosis without AI keys or file changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {spawnSync} from 'node:child_process';
          import {GitHub} from './.github/ai-bot/src/github.js';
          import {checkUpdate,installation,STATE,updates,Upstream} from './.github/ai-bot/src/updates.js';
          const original=globalThis.fetch;
          globalThis.fetch=async(url,options)=>{
            if(options?.method&&options.method!=='GET')throw new Error('Read-only diagnostic');
            const res=await original(url,options);
            const source=String(url).includes('/hrmcngs/github-ai-fix-bot/');
            console.log(JSON.stringify({endpoint:source?'public-source':'destination',status:res.status,remaining:res.headers.get('x-ratelimit-remaining')}));
            return res;
          };
          try{
            try{await new GitHub(process.env.GITHUB_REPOSITORY,process.env.GH_TOKEN,original).request('/repos/'+process.env.GITHUB_REPOSITORY);console.log('native fetch receiver: OK');}catch(e){console.log('native fetch receiver: '+String(e.code||e.name));}
            try{await new Upstream(original).request('/commits/main');console.log('native upstream receiver: OK');}catch(e){console.log('native upstream receiver: '+String(e.code||e.name));}
            const gh=new GitHub(process.env.GITHUB_REPOSITORY,process.env.GH_TOKEN);
            const repo=await gh.request(gh.path());const event=JSON.parse(await readFile(process.env.GITHUB_EVENT_PATH,'utf8'));console.log(JSON.stringify({event:process.env.GITHUB_EVENT_NAME,eventRepo:event.repository?.full_name,repository:process.env.GITHUB_REPOSITORY,ref:process.env.GITHUB_REF,defaultBranch:repo.default_branch}));console.log('destination: OK');
            const state=installation(JSON.parse(await readFile(STATE,'utf8')));console.log('installation: OK');
            const result=await checkUpdate(gh,state,undefined,'runtime');console.log(result?'update available':'no runtime update');
            process.argv[2]='check';
            const fixtureEnv={...process.env,GITHUB_REF:'refs/heads/'+repo.default_branch,AI_BOT_UPDATE_SCOPE:'runtime'};
            await updates(fixtureEnv);console.log('read-only check entry fixture: OK');
            let code=await readFile('.github/ai-bot/src/updates.js','utf8');
            code=code.replace("}catch{console.error('Botの更新確認・更新PR作成に失敗しました。設定とGitHub権限を確認してください。');", "}catch(error){console.error(JSON.stringify({code:error.code||'INTERNAL',name:error.name}));");
            await writeFile('.github/ai-bot/src/diagnostic-updates.js',code);
            const cli=spawnSync(process.execPath,['.github/ai-bot/src/diagnostic-updates.js','check'],{env:fixtureEnv,encoding:'utf8',timeout:60000,maxBuffer:10000});
            console.log('standalone CLI fixture exit: '+cli.status);
            console.log(cli.stdout);console.log(cli.stderr);

          }catch(error){console.log('safe error category: '+String(error.code||'INTERNAL')+' type: '+String(error.name));process.exitCode=1;}
          JS
